<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無人商店 · 紙本核對表（教材一）</title>
<style>
/* ============================================================
   紙本備用版 — A4 列印
   用途：
     1. 網頁 / 電腦出事時嘅後備
     2. 小組活動（人手一套圖卡）
     3. 學生用實體圖卡操作

   列印：Chrome / Edge → ⌘P → 目的地「另存為 PDF」
        → 紙張 A4 → 邊界「無」→ 勾「背景圖案」→ 縮放 100%

   ⚠ 設計紅線（改版時唔好踩）：
     ・圖卡上唔可以印任何標示邊樣喺清單上
     ・核對完成前，老師唔可以話學生知啱定錯
     ・兩個答案掣永遠並排、同一大小、同一位置感
   ============================================================ */
@page{ size:A4 portrait; margin:12mm 10mm; }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#F2F2F2;color:#000;
  font-family:"PingFang HK","PingFang TC","Heiti TC","Noto Sans HK",
              "Microsoft JhengHei",system-ui,sans-serif;}

.toolbar{
  position:sticky; top:0; z-index:9; background:#1F2937; color:#fff;
  padding:12px 18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;
}
.toolbar b{font-size:1rem;}
.toolbar .hint{font-size:.85rem; opacity:.85; line-height:1.6;}

.sheet{
  width:210mm; min-height:273mm; margin:16px auto; background:#fff;
  padding:0 10mm; box-shadow:0 3px 14px rgba(0,0,0,.18);
  display:flex; flex-direction:column;
}
.pg{ padding:10mm 10mm; }
.sheet > .pg{ padding:10mm 10mm; }

h2.sec{ font-size:12pt; margin:0 0 2mm; }

/* ── 一頁 2 張核對表 ── */
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:8mm; }
.card{ border:2.5pt solid #000; border-radius:6mm; padding:4.5mm 4mm 3.5mm; }

.hd{ display:flex; align-items:baseline; justify-content:space-between;
     border-bottom:2pt solid #000; padding-bottom:2mm; margin-bottom:3mm; }
.hd .t{ font-size:12pt; font-weight:900; }
.hd .n{ font-size:8pt; }

.cols{ display:grid; grid-template-columns:1fr 1fr; gap:3.5mm; }
.col > .lab{
  font-size:8pt; font-weight:900; background:#000; color:#fff;
  text-align:center; padding:1mm 0; border-radius:3mm; margin-bottom:2mm;
}
.slots{ display:flex; flex-direction:column; gap:2.5mm; }
.slot{
  aspect-ratio:1; border:1.6pt dashed #666; border-radius:3mm;
  display:grid; place-items:center; font-size:30pt; line-height:1;
}
.slot.blank{ font-size:7.5pt; color:#888; }

/* 誠實確認 — 教材最重要嗰一格 */
.declare{ margin-top:3.5mm; border:2.5pt solid #000; border-radius:4mm; padding:2.5mm; }
.declare .q{ font-size:10pt; font-weight:900; margin-bottom:2.5mm; line-height:1.4; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:3mm; }
.choice{
  border:2pt solid #000; border-radius:3mm; padding:2.5mm 1mm;
  font-size:10.5pt; font-weight:900; text-align:center;
}
.choice small{ display:block; font-size:6.5pt; font-weight:600; margin-top:.6mm; color:#333; }

.foot{ margin-top:2.5mm; font-size:6.8pt; color:#333; line-height:1.55; }

/* ── 圖卡頁 ── */
.cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:5mm; }
.pcard{
  aspect-ratio:1; border:2.5pt solid #000; border-radius:4mm;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1.5mm; break-inside:avoid;
}
.pcard .e{ font-size:34pt; line-height:1; }
.pcard .n{ font-size:8pt; font-weight:700; }
/* ⚠ 刻意冇 .cb（清單 ✓ / 干擾）標記 — 印咗就等於印咗答案 */

table{ width:100%; border-collapse:collapse; font-size:8pt; }
th,td{ border:1pt solid #000; padding:1.8mm 1.5mm; text-align:left; vertical-align:top; }
th{ background:#E8E8E8; font-weight:900; }
.note{ font-size:7.5pt; color:#333; line-height:1.6; margin:2mm 0 6mm; }

@media print{
  html,body{ background:#fff; }
  .toolbar{ display:none; }
  .sheet{ width:auto; min-height:0; margin:0; padding:0; box-shadow:none; }
  .pagebreak{ break-after:page; }
  .pagebreak:last-child{ break-after:auto; }
}
</style>
</head>
<body>

<div class="toolbar">
  <b>無人商店 · 紙本核對表（教材一）</b>
  <span class="hint">
    列印：⌘P → 另存為 PDF → A4 → 邊界「無」→ 勾「背景圖案」→ 縮放 100%<br>
    第 1–3 頁 = 核對表（每頁 2 份，每張單 1 頁）｜ 第 4–6 頁 = 圖卡 ｜ 第 7 頁 = 老師記錄表
  </span>
</div>

<div id="out"></div>

<script>
/* ============================================================
   資料 — 同 prototype/index.html 保持一致
   改內容請兩邊一齊改（見 docs/02）
   ============================================================ */
const LISTS = [
  { no:1, items:["apple","milk","cookie"],  shelf:["banana","bread","egg"] },
  { no:2, items:["banana","choco","bread"], shelf:["apple","cheese","chips"] },
  { no:3, items:["grape","corn","cheese"],  shelf:["banana","juicebox","pear"] },
];
const ITEMS = {
  apple:{emo:"🍎",name:"蘋果"},   milk:{emo:"🥛",name:"牛奶"}, cookie:{emo:"🍪",name:"餅乾"},
  banana:{emo:"🍌",name:"香蕉"},  choco:{emo:"🍫",name:"朱古力"}, bread:{emo:"🍞",name:"麵包"},
  grape:{emo:"🍇",name:"葡萄"},   corn:{emo:"🌽",name:"粟米"},   cheese:{emo:"🧀",name:"芝士"},
  juicebox:{emo:"🧃",name:"果汁盒"}, chips:{emo:"🍟",name:"薯片"}, egg:{emo:"🥚",name:"雞蛋"},
  pear:{emo:"🍐",name:"梨"},      orange:{emo:"🍊",name:"橙"},    melon:{emo:"🍉",name:"西瓜"},
};

const FLOW = `
  ① 老師派 6 張圖卡畀學生（3 張清單上、3 張干擾，全部冇標示）
  ② 學生將「清單上有」嗰 3 張擺去右邊
  ③ 老師讀：「無人店要付足錢。你攞嘅同清單一樣嗎？」——唔好提示
  ④ 學生指出答案
  ⑤ 老師喺記錄表填「誠實答覆」。<b>答錯都唔改。</b>`;

const tableHTML = (L) => `
  <div class="card">
    <div class="hd">
      <span class="t">第 ${L.no} 單 · 購物核對</span>
      <span class="n">姓名：____________</span>
    </div>
    <div class="cols">
      <div class="col">
        <div class="lab">清單</div>
        <div class="slots">
          ${L.items.map(i=>`<div class="slot">${ITEMS[i].emo}</div>`).join("")}
        </div>
      </div>
      <div class="col">
        <div class="lab">我攞咗嘅</div>
        <div class="slots">
          ${L.items.map(()=>`<div class="slot blank">擺圖卡</div>`).join("")}
        </div>
      </div>
    </div>
    <div class="declare">
      <div class="q">你攞嘅嘢，同清單一樣嗎？<br>
        <span style="font-weight:700;font-size:8.5pt;">（無人店冇人睇住都要付足；老實講就得）</span></div>
      <div class="choices">
        <div class="choice">✅ 一樣<small>或者指一指上面</small></div>
        <div class="choice">❌ 唔一樣<small>或者擰一擰頭</small></div>
      </div>
    </div>
    <div class="foot">${FLOW}</div>
  </div>`;

const cardHTML = (i) => `
  <div class="pcard">
    <span class="e">${ITEMS[i].emo}</span>
    <span class="n">${ITEMS[i].name}</span>
  </div>`;

/* ── 砌頁 ── */
const page = (inner, cls="") => `<section class="sheet pagebreak ${cls}"><div class="pg">${inner}</div></section>`;

let html = "";

// 第 1–3 頁：核對表（每頁 2 份）
LISTS.forEach(L=>{
  html += page(`<div class="grid">${tableHTML(L)}${tableHTML(L)}</div>`);
});

// 第 4–6 頁：圖卡（每張單 6 張，3×2）
LISTS.forEach(L=>{
  html += page(
    `<h2 class="sec">第 ${L.no} 單 圖卡（共 6 張）</h2>
     <p class="note">沿外框剪出。學生將「清單上有」嗰 3 張擺去右邊 ——
       <b>卡上刻意冇印邊樣喺清單上</b>，要學生自己對。</p>
     <div class="cards">${L.items.concat(L.shelf).map(cardHTML).join("")}</div>`
  );
});

// 第 7 頁：老師記錄表
html += page(`
  <h2 class="sec">老師記錄表 — 一張單一行</h2>
  <p class="note">
    <b>最重要嘅欄：誠實答覆 vs 實際。</b>
    兩個唔同 → 學生<b>未自己核對就亂答</b>，要再教；
    兩個一樣 → 學生真係自己睇過先答。<br>
    注意：呢個活動<b>唔計分</b>，「答錯但老實」同「答啱但冇睇過」要分開睇。
  </p>
  <table>
    <thead><tr>
      <th style="width:7%">單</th><th style="width:19%">清單內容</th>
      <th style="width:19%">學生攞到</th><th style="width:15%">誠實答覆</th>
      <th style="width:12%">實際</th><th style="width:16%">觀察</th><th style="width:12%">再教？</th>
    </tr></thead>
    <tbody>
      ${LISTS.map(L=>`<tr>
        <td>${L.no}</td><td></td><td></td>
        <td>□ 一樣<br>□ 唔一樣</td>
        <td>□ 一樣<br>□ 唔一樣</td><td></td>
        <td>□ 要<br>□ 唔要</td>
      </tr>`).join("")}
    </tbody>
  </table>

  <h2 class="sec" style="margin-top:9mm;">全班統計（活動完填）</h2>
  <table>
    <thead><tr><th style="width:62%">指標</th><th style="width:14%">人數</th><th style="width:24%">備註</th></tr></thead>
    <tbody>
      <tr><td>誠實答覆 ≠ 實際（未自己核對就答）</td><td></td><td></td></tr>
      <tr><td>敢於答「唔一樣」（誠實交代）</td><td></td><td></td></tr>
      <tr><td>三單都完成</td><td></td><td></td></tr>
      <tr><td>需要成人提示／接手</td><td></td><td></td></tr>
    </tbody>
  </table>

  <h2 class="sec" style="margin-top:9mm;">老師引導語（口頭，唔好搶住答）</h2>
  <p class="note">
    「㩒你自己鍾意嗰樣」／「數下籃度有幾多樣」／「睇下左邊同右邊係咪一樣」／
    「冇人睇住都要付足」／「老實講就得」／「你自己話，我聽你講」<br>
    <b>唔好用：</b>「你攞錯咗㗎啦」「應該係呢樣」— 一講咗，誠信練習就冇咗。
  </p>
`);

document.getElementById("out").innerHTML = html;
</script>
</body>
</html>
